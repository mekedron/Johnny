# Johnny — local stack: api, worker, frontend, postgres (with pgvector), redis.
# Single command: `cp .env.example .env && docker compose up`.

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://johnny:johnny@postgres:5432/johnny}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  FERNET_KEY: ${FERNET_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-johnny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-johnny}
      POSTGRES_DB: ${POSTGRES_DB:-johnny}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-johnny} -d ${POSTGRES_DB:-johnny}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - worker_state:/var/lib/johnny/worker
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os, sys, time; p = '/var/lib/johnny/worker/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 30 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Base image for per-session meet-worker containers (Playwright +
  # Chromium + Xvfb + PulseAudio). The "meet-worker" profile keeps the
  # service out of `docker compose up` — the scheduler spawns one of
  # these per active session via the Docker SDK (US-029/US-030).
  # Build with: `docker compose --profile meet-worker build meet-worker`.
  meet-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.meet-worker
    image: johnny-meet-worker:latest
    profiles: ["meet-worker"]

volumes:
  postgres_data:
  redis_data:
  worker_state:
