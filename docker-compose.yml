# Johnny — local stack: api, worker, frontend, postgres (with pgvector), redis.
# Single command: `cp .env.example .env && docker compose up`.

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://johnny:johnny@postgres:5432/johnny}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  FERNET_KEY: ${FERNET_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  JOHNNY_CALENDAR_POLL_INTERVAL_SECONDS: ${JOHNNY_CALENDAR_POLL_INTERVAL_SECONDS:-300}
  JOHNNY_USE_DOCKER_LAUNCHER: ${JOHNNY_USE_DOCKER_LAUNCHER:-true}
  JOHNNY_MEET_WORKER_IMAGE: ${JOHNNY_MEET_WORKER_IMAGE:-johnny-meet-worker:latest}
  JOHNNY_CONTAINER_MONITOR_INTERVAL_SECONDS: ${JOHNNY_CONTAINER_MONITOR_INTERVAL_SECONDS:-30}
  JOHNNY_CONTAINER_PRUNE_INTERVAL_SECONDS: ${JOHNNY_CONTAINER_PRUNE_INTERVAL_SECONDS:-3600}
  JOHNNY_CONTAINER_PRUNE_AGE_SECONDS: ${JOHNNY_CONTAINER_PRUNE_AGE_SECONDS:-86400}
  JOHNNY_TRANSPORT: ${JOHNNY_TRANSPORT:-local}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_TOKEN: ${LIVEKIT_TOKEN:-}
  LIVEKIT_ROOM: ${LIVEKIT_ROOM:-}
  LIVEKIT_IDENTITY: ${LIVEKIT_IDENTITY:-johnny-bot}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-johnny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-johnny}
      POSTGRES_DB: ${POSTGRES_DB:-johnny}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-johnny} -d ${POSTGRES_DB:-johnny}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Mount the host docker socket so the API can spawn meet-worker
    # containers via the Docker SDK (US-030). Keeping this read-write
    # is required to start/stop/remove containers. The `whisper_models`
    # volume is shared with the meet-worker so the providers `/test`
    # endpoint reuses any cached CTranslate2 weights (and writes new
    # downloads into the same place future meet-workers will read from).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - whisper_models:/var/lib/johnny/whisper-models
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - worker_state:/var/lib/johnny/worker
      # Same docker socket mount as the API — the worker drives the
      # periodic scheduler / monitor / prune passes (US-030).
      - /var/run/docker.sock:/var/run/docker.sock
      # Share the whisper-model cache with api/meet-worker so any
      # CTranslate2 weights downloaded by one service are visible to
      # the others (the worker image is identical to the api image).
      - whisper_models:/var/lib/johnny/whisper-models
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os, sys, time; p = '/var/lib/johnny/worker/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 30 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Base image for per-session meet-worker containers (Playwright +
  # Chromium + Xvfb + PulseAudio). The "meet-worker" profile keeps the
  # service out of `docker compose up` — the scheduler spawns one of
  # these per active session via the Docker SDK (US-029/US-030).
  # Build with: `docker compose --profile meet-worker build meet-worker`.
  meet-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.meet-worker
    image: johnny-meet-worker:latest
    profiles: ["meet-worker"]
    # Per-session containers attach these volumes so downloaded model
    # files survive restarts. The scheduler (US-029/US-030) will mount
    # the same named volumes into each spawned container.
    volumes:
      - piper_models:/var/lib/johnny/piper-models
      - whisper_models:/var/lib/johnny/whisper-models

volumes:
  postgres_data:
  redis_data:
  worker_state:
  piper_models:
  whisper_models:
