# Johnny — local stack: api, worker, frontend, postgres (with pgvector), redis.
# Single command: `cp .env.example .env && docker compose up`.

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://johnny:johnny@postgres:5432/johnny}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  FERNET_KEY: ${FERNET_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  JOHNNY_CALENDAR_POLL_INTERVAL_SECONDS: ${JOHNNY_CALENDAR_POLL_INTERVAL_SECONDS:-300}
  JOHNNY_PROVIDERS_FILE: ${JOHNNY_PROVIDERS_FILE:-/config/providers.json}
  JOHNNY_PROVIDERS_SEED_MODE: ${JOHNNY_PROVIDERS_SEED_MODE:-insert-only}
  JOHNNY_USE_DOCKER_LAUNCHER: ${JOHNNY_USE_DOCKER_LAUNCHER:-true}
  JOHNNY_MEET_WORKER_IMAGE: ${JOHNNY_MEET_WORKER_IMAGE:-johnny-meet-worker:latest}
  # docker compose prefixes volume names with the project name (default
  # ``johnny``), so the launcher inside this container needs the same
  # prefixed names — otherwise spawned meet-workers see empty named
  # volumes instead of the shared model / auth state. Override
  # COMPOSE_PROJECT_NAME if you renamed the project.
  JOHNNY_MEET_WORKER_NETWORK: ${JOHNNY_MEET_WORKER_NETWORK:-johnny_default}
  JOHNNY_MEET_WORKER_AUTH_VOLUME: ${JOHNNY_MEET_WORKER_AUTH_VOLUME:-johnny_google_auth_state}
  # Bot-signin container settings (Johnny-105). Same compose-project
  # prefix rules apply: override JOHNNY_BOT_SIGNIN_PENDING_VOLUME if
  # you renamed COMPOSE_PROJECT_NAME.
  JOHNNY_BOT_SIGNIN_IMAGE: ${JOHNNY_BOT_SIGNIN_IMAGE:-johnny-bot-signin:latest}
  JOHNNY_BOT_SIGNIN_NETWORK: ${JOHNNY_BOT_SIGNIN_NETWORK:-johnny_default}
  JOHNNY_BOT_SIGNIN_PENDING_VOLUME: ${JOHNNY_BOT_SIGNIN_PENDING_VOLUME:-johnny_bot_signin_pending}
  JOHNNY_BOT_SIGNIN_PENDING_ROOT: ${JOHNNY_BOT_SIGNIN_PENDING_ROOT:-/var/lib/johnny/bot-signin-pending}
  # Host bind-mount paths the meet-worker launcher passes to each
  # spawned container so a voice / whisper model downloaded once stays
  # readable from the host (``ls ~/.johnny/piper-models``). Setting these
  # to a Docker named volume name (no leading slash) is still allowed —
  # the launcher mounts it as a named volume in that case for backwards
  # compatibility with non-Compose deployments that haven't moved off
  # the legacy ``johnny_*_models`` volumes yet.
  JOHNNY_MEET_WORKER_WHISPER_VOLUME: ${JOHNNY_MEET_WORKER_WHISPER_VOLUME:-${HOME}/.johnny/whisper-models}
  JOHNNY_MEET_WORKER_PIPER_VOLUME: ${JOHNNY_MEET_WORKER_PIPER_VOLUME:-${HOME}/.johnny/piper-models}
  JOHNNY_MEET_WORKER_PARAKEET_VOLUME: ${JOHNNY_MEET_WORKER_PARAKEET_VOLUME:-${HOME}/.johnny/parakeet-models}
  # Host bind-mount for the runtime-installed Parakeet Python packages
  # (Johnny-stt.1). The api / meet-worker code prepends this dir to
  # sys.path on startup so `import nemo.collections.asr` works whenever
  # the user has clicked Install on the Parakeet provider card; the
  # image itself ships NO NeMo / torch — installs live entirely under
  # ~/.johnny/parakeet-packages. The launcher passes this through to
  # each spawned meet-worker too so live sessions can use Parakeet.
  JOHNNY_MEET_WORKER_PARAKEET_PACKAGES_VOLUME: ${JOHNNY_MEET_WORKER_PARAKEET_PACKAGES_VOLUME:-${HOME}/.johnny/parakeet-packages}
  JOHNNY_PARAKEET_PACKAGES_DIR: ${JOHNNY_PARAKEET_PACKAGES_DIR:-/var/lib/johnny/parakeet-packages}
  # Captured reply audio (Johnny-od1): every utterance Johnny speaks is saved
  # as a WAV under <dir>/<bot_session_id>/ for History + live-view playback.
  # Host bind-mount shared by api (browser sessions + serving + delete),
  # agent-worker (Meet TTS), worker (orphan sweep), and each spawned
  # meet-worker via the launcher volume below.
  JOHNNY_SESSION_AUDIO_DIR: ${JOHNNY_SESSION_AUDIO_DIR:-/var/lib/johnny/session-audio}
  JOHNNY_MEET_WORKER_SESSION_AUDIO_VOLUME: ${JOHNNY_MEET_WORKER_SESSION_AUDIO_VOLUME:-${HOME}/.johnny/session-audio}
  JOHNNY_CONTAINER_MONITOR_INTERVAL_SECONDS: ${JOHNNY_CONTAINER_MONITOR_INTERVAL_SECONDS:-30}
  JOHNNY_CONTAINER_PRUNE_INTERVAL_SECONDS: ${JOHNNY_CONTAINER_PRUNE_INTERVAL_SECONDS:-3600}
  JOHNNY_CONTAINER_PRUNE_AGE_SECONDS: ${JOHNNY_CONTAINER_PRUNE_AGE_SECONDS:-86400}
  JOHNNY_TRANSPORT: ${JOHNNY_TRANSPORT:-local}
  # Defaults point at the in-compose self-hosted LiveKit SFU (Johnny-6wx).
  # Only consumed when JOHNNY_TRANSPORT=livekit (default is ``local``), so
  # a non-empty URL here is harmless for the current pipeline — it just
  # gives the agent worker (Johnny-9eh) a sane in-network endpoint.
  LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
  LIVEKIT_TOKEN: ${LIVEKIT_TOKEN:-}
  LIVEKIT_ROOM: ${LIVEKIT_ROOM:-}
  LIVEKIT_IDENTITY: ${LIVEKIT_IDENTITY:-johnny-bot}
  # API key/secret used to mint LiveKit room tokens. MUST match the
  # ``LIVEKIT_KEYS`` the ``livekit`` service is configured with — both read
  # the same two .env vars so they cannot drift. The secret must be >= 32
  # chars or the server refuses to start.
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-johnny-livekit-dev-secret-change-me-0123456789}
  # Per-session orchestrator (Johnny-wz5 / Johnny-n22): ``agentsession``
  # (default) dispatches the LiveKit agent worker AND switches each spawned
  # meet-worker to pure-bridge mode; ``legacy`` keeps the in-worker voice
  # pipeline. Johnny-n22 flipped the default to agentsession (parity proven);
  # this fallback matches .env.example so a clean install works without a
  # .env override. Set JOHNNY_ORCHESTRATOR=legacy to roll back.
  JOHNNY_ORCHESTRATOR: ${JOHNNY_ORCHESTRATOR:-agentsession}
  # Skills sandbox (Johnny-trt.35): internal-only exec API the tool layer
  # (Johnny-trt.23) calls to run CLI / skill commands, and the path where
  # skill packages (<name>/SKILL.md) are discovered. The /skills mount uses
  # the SAME container path in api/worker/skills-sandbox on purpose, so a
  # skill directory needs no per-container path translation.
  JOHNNY_SKILLS_SANDBOX_URL: ${JOHNNY_SKILLS_SANDBOX_URL:-http://skills-sandbox:8088}
  JOHNNY_SKILLS_DIR: ${JOHNNY_SKILLS_DIR:-/skills}
  # Native tool-calling cutover (Johnny-3ow): give the answer agent generic
  # exec/read/write/list_dir tools bound to its sandbox container so it composes
  # the user's REAL arguments and runs skills as files (openclaw model), instead
  # of the keyword router firing one fixed argv with empty args. ON by default;
  # set to 0 to fall back to the legacy keyword-delegate path.
  JOHNNY_SANDBOX_FULL_ACCESS: ${JOHNNY_SANDBOX_FULL_ACCESS:-1}
  # Internal tools (Johnny-trt.57): where the agent process (api for the
  # playground, agent-worker for Meet) reaches Johnny's own api for
  # first-party actions — meeting.leave posts the bot-dismissal endpoint,
  # session.end posts /sessions/{id}/stop. Same endpoints the UI buttons hit.
  JOHNNY_API_BASE_URL: ${JOHNNY_API_BASE_URL:-http://api:8000}
  # Delegated-task executor pass (Johnny-trt.24): the worker claims queued
  # agent_tasks rows (woken by johnny.tasks.wake, polled as fallback), runs
  # them via the skills-sandbox with bounded concurrency, and TTL-requeues
  # rows stranded by a crash. Defaults live in app/services/task_worker.py;
  # these pass operator overrides through.
  JOHNNY_TASK_EXECUTOR_ENABLED: ${JOHNNY_TASK_EXECUTOR_ENABLED:-true}
  JOHNNY_TASK_POLL_INTERVAL_SECONDS: ${JOHNNY_TASK_POLL_INTERVAL_SECONDS:-5}
  JOHNNY_TASK_CONCURRENCY: ${JOHNNY_TASK_CONCURRENCY:-4}
  JOHNNY_TASK_RUNNING_TTL_SECONDS: ${JOHNNY_TASK_RUNNING_TTL_SECONDS:-300}
  JOHNNY_TASK_MAX_ATTEMPTS: ${JOHNNY_TASK_MAX_ATTEMPTS:-3}
  JOHNNY_TASK_EXEC_TIMEOUT_SECONDS: ${JOHNNY_TASK_EXEC_TIMEOUT_SECONDS:-240}
  # Per-workspace sandbox containers (Johnny-wks.2): the api (dispatch) and
  # worker (task claim + idle sweep) lazily launch one container of the
  # skills-sandbox image per NON-default workspace, named
  # johnny-workspace-<id> and labelled johnny.workspace-id=<id>. The image
  # tag matches the `image:` the skills-sandbox service is built with. Idle
  # containers are stopped after the TTL; their named state volumes
  # (johnny-workspace-<id>-home) are launcher-created — NOT compose-declared
  # — so `down -v` resets never delete workspace state.
  JOHNNY_WORKSPACE_SANDBOX_IMAGE: ${JOHNNY_WORKSPACE_SANDBOX_IMAGE:-johnny-skills-sandbox:latest}
  JOHNNY_WORKSPACE_SANDBOX_NETWORK: ${JOHNNY_WORKSPACE_SANDBOX_NETWORK:-johnny_default}
  JOHNNY_WORKSPACE_IDLE_TTL_SECONDS: ${JOHNNY_WORKSPACE_IDLE_TTL_SECONDS:-1800}
  JOHNNY_WORKSPACE_SWEEP_INTERVAL_SECONDS: ${JOHNNY_WORKSPACE_SWEEP_INTERVAL_SECONDS:-60}
  JOHNNY_WORKSPACE_STARTUP_TIMEOUT_SECONDS: ${JOHNNY_WORKSPACE_STARTUP_TIMEOUT_SECONDS:-20}
  # Per-workspace SKILL PACKAGES (Johnny-wks.3): workspace <slug>'s skills
  # live under ~/.johnny/workspaces/<slug>/skills on the host. Each
  # workspace container bind-mounts ITS OWN dir read-only at /skills (the
  # launcher needs the HOST path — bind sources are resolved by the docker
  # daemon, not inside this container), while api/worker/agent-worker see
  # the whole tree at /workspaces for discovery and the install flow. The
  # DEFAULT workspace keeps the shared ${HOME}/.johnny/skills volume above —
  # byte-identical pre-workspaces behavior.
  JOHNNY_WORKSPACES_HOST_DIR: ${JOHNNY_WORKSPACES_HOST_DIR:-${HOME}/.johnny/workspaces}
  JOHNNY_WORKSPACES_DIR: ${JOHNNY_WORKSPACES_DIR:-/workspaces}
  # Mirrored onto every spawned workspace sandbox so ONE set of operator
  # knobs governs the default compose sandbox and the per-workspace ones
  # alike (the skills-sandbox service below reads the same variables).
  JOHNNY_SANDBOX_CPUS: ${JOHNNY_SANDBOX_CPUS:-2}
  JOHNNY_SANDBOX_MEM_LIMIT: ${JOHNNY_SANDBOX_MEM_LIMIT:-1g}
  SANDBOX_EXEC_TIMEOUT_DEFAULT_S: ${SANDBOX_EXEC_TIMEOUT_DEFAULT_S:-30}
  SANDBOX_EXEC_TIMEOUT_MAX_S: ${SANDBOX_EXEC_TIMEOUT_MAX_S:-300}
  SANDBOX_EXEC_OUTPUT_CAP_BYTES: ${SANDBOX_EXEC_OUTPUT_CAP_BYTES:-262144}
  SANDBOX_EXEC_BODY_CAP_BYTES: ${SANDBOX_EXEC_BODY_CAP_BYTES:-262144}
  GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-johnny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-johnny}
      POSTGRES_DB: ${POSTGRES_DB:-johnny}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-johnny} -d ${POSTGRES_DB:-johnny}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Self-hosted LiveKit SFU (Johnny-6wx). Carries the voice pipeline's
  # double hop (Meet -> room -> agent -> room -> Meet) once the agent
  # worker (Johnny-9eh) and the meet-worker bridge (Johnny-6nm) land.
  # Single-node and stateless — rooms are ephemeral, so no volume is
  # needed and it survives a ``docker compose down -v`` factory reset
  # with nothing to restore. Topology validated by the Johnny-4em spike.
  #
  # INTERNAL ONLY: there is deliberately no ``ports:`` mapping, so the
  # WebSocket signaling + RTC media surface is reachable only from other
  # containers on ``johnny_default`` (api, worker, agent, meet-worker) and
  # never from the host. That satisfies "no unauthenticated WS exposure":
  # nothing is published off-box, and the configured API key/secret
  # (``LIVEKIT_KEYS``) is required to mint the room tokens clients present.
  # ``expose`` is metadata only — container-to-container reachability on a
  # user-defined bridge network needs no published port (incl. the RTC UDP
  # media range, which stays internal to the bridge).
  livekit:
    image: livekit/livekit-server:v1.12.0
    command: ["--config", "/etc/livekit/livekit.yaml"]
    environment:
      # Compose substitutes ${LIVEKIT_API_KEY}/${LIVEKIT_API_SECRET} from
      # .env, so the container receives a literal "key: secret". The same
      # two vars feed api/worker (LIVEKIT_API_KEY / LIVEKIT_API_SECRET) so a
      # token minted there validates against this server. The secret must
      # be >= 32 chars or the server refuses to start.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-johnny-livekit-dev-secret-change-me-0123456789}"
    volumes:
      # Committed config (RTC ports + internal-only posture). Read-only;
      # the server never writes here, so it survives a clean checkout.
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    expose:
      - "7880"
      - "7881"
    healthcheck:
      # LiveKit answers GET / with "OK" on the signaling port once ready.
      # The image is Alpine-based, so busybox ``wget`` is available.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot Alembic upgrade. Runs once, exits 0 on success, and
  # ``api`` / ``worker`` gate their start on ``service_completed_successfully``
  # so the API never boots against an un-migrated schema. Re-running
  # ``docker compose up`` is safe — Alembic is a no-op when the DB is
  # already at head.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # Mount the host docker socket so the API can spawn meet-worker
    # containers via the Docker SDK (US-030). Keeping this read-write
    # is required to start/stop/remove containers. The model-cache
    # volumes (whisper_models, piper_models) are shared with the
    # meet-worker so the providers `/test` endpoint reuses any cached
    # weights / voices (and writes new downloads into the same place
    # future meet-workers will read from).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Model caches as HOST BIND MOUNTS so the user can drop files in
      # by hand (``ls ~/.johnny/piper-models``) without docker cp, and
      # so downloads survive ``docker compose down -v`` resets. ``run.sh``
      # creates these dirs idempotently on first boot.
      - ${HOME}/.johnny/whisper-models:/var/lib/johnny/whisper-models
      - ${HOME}/.johnny/piper-models:/var/lib/johnny/piper-models
      - ${HOME}/.johnny/parakeet-models:/var/lib/johnny/parakeet-models
      # Kokoro (82 M) and KittenTTS (<25 M) weights for the in-container
      # runtime (Johnny-1ge.11). Same host-bind-mount pattern as the other
      # model caches: the first synth downloads from HuggingFace into these
      # dirs, and the download survives `docker compose down -v` so a clean
      # `./run.sh` does not re-fetch. `run.sh` creates the host dirs idempotently.
      - ${HOME}/.johnny/kokoro-models:/var/lib/johnny/kokoro-models
      - ${HOME}/.johnny/kitten-models:/var/lib/johnny/kitten-models
      # Runtime-installed Parakeet Python packages (Johnny-stt.1). Empty
      # on first boot; populated by clicking Install on the Parakeet
      # provider card. The api server prepends this dir to sys.path so
      # `import nemo` works without rebuilding the image.
      - ${HOME}/.johnny/parakeet-packages:/var/lib/johnny/parakeet-packages
      # Captured reply audio (Johnny-od1): in-browser sessions write WAVs
      # here, the playback endpoint serves them, and the History delete
      # removes the per-session dir. Host bind mount so files survive
      # `docker compose down -v` resets; run.sh creates the host dir.
      - ${HOME}/.johnny/session-audio:/var/lib/johnny/session-audio
      # google_auth_state holds the Playwright storage_state.json files
      # per bot account so the meet-worker can sign into Google without
      # an interactive OAuth round-trip per session (Johnny-ckz.1).
      # The API mounts it read-write so a setup helper can seed cookies;
      # the meet-worker mounts the same volume read-only.
      - google_auth_state:/var/lib/johnny/google-auth
      # bot_signin_pending holds the supervisor handoff during noVNC
      # bot sign-ins (Johnny-105). The bot-signin container writes
      # ``{signin_id}/storage_state.json`` + ``marker.json`` here; the
      # API reads + atomically moves the storage_state into
      # ``google_auth_state`` once the supervisor reports success.
      - bot_signin_pending:/var/lib/johnny/bot-signin-pending
      # Provider config seed (Johnny-d3e). The api auto-imports
      # ``/config/providers.json`` on startup so a committed export
      # (Johnny-k3z) is re-applied after a clean stack reset.
      # Read-only: the seeder never writes back here. Mount is
      # optional — the seeder silently skips when the directory is
      # absent so a fresh checkout without a ./config dir still boots.
      - ./config:/config:ro
      # Skill packages (Johnny-trt.35): host dir shared with the worker and
      # the skills-sandbox so the skill loader (Johnny-trt.23) discovers
      # <name>/SKILL.md here. Mounted at /skills (not /var/lib/johnny/...)
      # deliberately — identical container path in every service means skill
      # dirs need no path translation between discovery (api/worker) and
      # execution (sandbox). Read-write here for the skill-install flow
      # (Johnny-trt.32, default-workspace target); the sandbox mounts it
      # read-only.
      - ${HOME}/.johnny/skills:/skills
      # Per-workspace trees (Johnny-wks.3): <slug>/skills holds each
      # non-default workspace's packages — the api scans them for the
      # workspace-keyed capability views, writes installs targeted at a
      # workspace, and pre-creates <slug>/skills before the launcher
      # bind-mounts it into that workspace's container.
      - ${HOME}/.johnny/workspaces:/workspaces
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - worker_state:/var/lib/johnny/worker
      # Same docker socket mount as the API — the worker drives the
      # periodic scheduler / monitor / prune passes (US-030).
      - /var/run/docker.sock:/var/run/docker.sock
      # Share the on-device model caches with api/meet-worker so any
      # CTranslate2 weights / Piper voices downloaded by one service
      # are visible to the others (the worker image is identical to
      # the api image). Host bind mounts — see api notes above.
      - ${HOME}/.johnny/whisper-models:/var/lib/johnny/whisper-models
      - ${HOME}/.johnny/piper-models:/var/lib/johnny/piper-models
      - ${HOME}/.johnny/parakeet-models:/var/lib/johnny/parakeet-models
      # Kokoro + KittenTTS in-container weights (Johnny-1ge.11) — see api notes.
      - ${HOME}/.johnny/kokoro-models:/var/lib/johnny/kokoro-models
      - ${HOME}/.johnny/kitten-models:/var/lib/johnny/kitten-models
      - ${HOME}/.johnny/parakeet-packages:/var/lib/johnny/parakeet-packages
      # Captured reply audio (Johnny-od1): the worker's hourly sweep removes
      # per-session dirs whose bot_sessions row no longer exists.
      - ${HOME}/.johnny/session-audio:/var/lib/johnny/session-audio
      # Same shared google-auth volume as the API (read-write here so
      # an admin endpoint or one-time helper can refresh stored cookies
      # from inside the worker process if needed).
      - google_auth_state:/var/lib/johnny/google-auth
      # Bot-signin handoff volume (Johnny-105). The worker's orphan
      # sweep cleans up per-session directories left behind when a
      # supervisor crashes mid-flow.
      - bot_signin_pending:/var/lib/johnny/bot-signin-pending
      # Skill packages (Johnny-trt.35) — same path as api/skills-sandbox;
      # the worker executor pass (Johnny-trt.24) reads SKILL.md from here.
      - ${HOME}/.johnny/skills:/skills
      # Per-workspace trees (Johnny-wks.3): the worker's registry loads
      # scan <slug>/skills for non-default claims, and its claim-path
      # container ensure pre-creates the dir before the bind mount.
      - ${HOME}/.johnny/workspaces:/workspaces
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os, sys, time; p = '/var/lib/johnny/worker/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 30 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Long-running LiveKit agent worker (Johnny-9eh, epic Johnny-7g5). Registers
  # with the in-compose `livekit` SFU under agent_name="johnny" (a non-empty name
  # disables LiveKit automatic dispatch) and runs one AgentSession job per Meet
  # session the API dispatches into that session's room (johnny-session-<id>).
  # Shares the api/worker image (same ./backend build + backend-env): the `agent`
  # extra and the baked LiveKit model files (Silero VAD + multilingual turn
  # detector) already live in that image (Johnny-jue), so a clean ./run.sh brings
  # it up offline. No host `ports:` — it reaches the SFU only over the internal
  # johnny_default network. Lifecycle is per-room: each job ends when the bridge /
  # humans leave the room, so there are no orphan workers — the single service
  # stays up waiting for the next dispatch.
  agent-worker:
    build:
      context: ./backend
    command: ["python", "-m", "johnny.agent.worker", "start"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Share the on-device model caches with api/worker/meet-worker so the
      # split-session adapters built from the dispatched provider_config load the
      # same downloaded weights (faster-whisper, Piper, Parakeet, Kokoro,
      # KittenTTS) instead of re-fetching. Host bind mounts — see api notes above.
      - ${HOME}/.johnny/whisper-models:/var/lib/johnny/whisper-models
      - ${HOME}/.johnny/piper-models:/var/lib/johnny/piper-models
      - ${HOME}/.johnny/parakeet-models:/var/lib/johnny/parakeet-models
      - ${HOME}/.johnny/kokoro-models:/var/lib/johnny/kokoro-models
      - ${HOME}/.johnny/kitten-models:/var/lib/johnny/kitten-models
      - ${HOME}/.johnny/parakeet-packages:/var/lib/johnny/parakeet-packages
      # Captured reply audio (Johnny-od1): the dispatched AgentSession's TTS
      # adapter writes one WAV per spoken reply here for Meet split sessions.
      - ${HOME}/.johnny/session-audio:/var/lib/johnny/session-audio
      # Skill packages (Johnny-trt.23) — the Meet-surface session assembly
      # loads the skill registry (router task catalog + executor) from the
      # same /skills path as api/worker. Read-only: the agent worker only
      # discovers skills; installs go through the api (Johnny-trt.32).
      - ${HOME}/.johnny/skills:/skills:ro
      # Per-workspace trees (Johnny-wks.3): Meet sessions of agents on a
      # non-default workspace discover that workspace's packages here.
      # Read-only for the same reason as /skills.
      - ${HOME}/.johnny/workspaces:/workspaces:ro

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Skills sandbox (Johnny-trt.35) — the execution boundary for all skill /
  # CLI tool work. A separate, operator-customizable container where CLI
  # tools are installed and skills live; the tool layer (Johnny-trt.23)
  # POSTs to its exec API instead of running commands in api/worker.
  #
  # INTERNAL ONLY: no ``ports:`` mapping, so the (deliberately unauthed)
  # exec API at http://skills-sandbox:8088 is reachable only from other
  # containers on ``johnny_default`` — never from the host. ``expose`` is
  # metadata; container-to-container reachability needs no published port.
  #
  # Security: non-root user (Dockerfile USER sandbox), per-exec timeout +
  # output caps (execd.py), and the compose resource limits below. Only two
  # mounts — skill packages (read-only) and the sandbox home — no docker
  # socket, no source tree. Network egress stays allowed: tools need it.
  skills-sandbox:
    build:
      context: ./sandbox
    # Explicit tag (the meet-worker pattern) so the per-workspace launcher
    # (Johnny-wks.2) can spawn additional containers of this exact image —
    # `./run.sh`'s `up -d --build` builds and tags it with no extra step.
    image: johnny-skills-sandbox:latest
    expose:
      - "8088"
    ports:
      # gog OAuth callback — published so the host browser can complete
      # `gog auth add --listen-addr=0.0.0.0:8089`; harmless when not authing.
      - "127.0.0.1:8089:8089"
    environment:
      SANDBOX_EXEC_PORT: "8088"
      SANDBOX_EXEC_TIMEOUT_DEFAULT_S: ${SANDBOX_EXEC_TIMEOUT_DEFAULT_S:-30}
      SANDBOX_EXEC_TIMEOUT_MAX_S: ${SANDBOX_EXEC_TIMEOUT_MAX_S:-300}
      SANDBOX_EXEC_OUTPUT_CAP_BYTES: ${SANDBOX_EXEC_OUTPUT_CAP_BYTES:-262144}
      SANDBOX_EXEC_BODY_CAP_BYTES: ${SANDBOX_EXEC_BODY_CAP_BYTES:-262144}
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
    volumes:
      # Skill packages — same host dir as api/worker, same /skills container
      # path (no path translation); read-only so a runaway command cannot
      # corrupt skill definitions. run.sh creates the host dir idempotently.
      - ${HOME}/.johnny/skills:/skills:ro
      # The sandbox user's home: gog credentials + tool dotfiles. A HOST
      # bind mount (not a named volume) so auth done once survives image
      # rebuilds AND ./stop.sh factory resets — same reasoning as the
      # ~/.johnny model caches. Linux hosts: chown to uid 1000.
      - ${HOME}/.johnny/sandbox-home:/home/sandbox
    cpus: ${JOHNNY_SANDBOX_CPUS:-2}
    mem_limit: ${JOHNNY_SANDBOX_MEM_LIMIT:-1g}
    pids_limit: 256
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Base image for per-session meet-worker containers (Playwright +
  # Chromium + Xvfb + PulseAudio). The "meet-worker" profile keeps the
  # service out of `docker compose up` — the scheduler spawns one of
  # these per active session via the Docker SDK (US-029/US-030).
  # Build with: `docker compose --profile meet-worker build meet-worker`.
  meet-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.meet-worker
    image: johnny-meet-worker:latest
    profiles: ["meet-worker"]
    # Per-session containers attach these dirs so downloaded model
    # files survive restarts. The scheduler (US-029/US-030) will mount
    # the same host paths into each spawned container.
    volumes:
      - ${HOME}/.johnny/piper-models:/var/lib/johnny/piper-models
      - ${HOME}/.johnny/whisper-models:/var/lib/johnny/whisper-models
      - ${HOME}/.johnny/parakeet-models:/var/lib/johnny/parakeet-models
      - ${HOME}/.johnny/parakeet-packages:/var/lib/johnny/parakeet-packages
      # Captured reply audio (Johnny-od1): one WAV per assistant response
      # (written from the agent-worker; the mount is kept on the meet-worker
      # for the bridge-era serving path).
      - ${HOME}/.johnny/session-audio:/var/lib/johnny/session-audio

  # Base image for the noVNC bot sign-in flow (Johnny-105). Playwright
  # Chromium under Xvfb, with x11vnc serving the display over a
  # websockify TCP bridge so the user's browser can attach via a noVNC
  # canvas. The "bot-signin" profile keeps the service out of
  # `docker compose up` — the API spawns one per sign-in via the
  # Docker SDK using ``app.services.bot_signin_launcher``.
  # Build with: `docker compose --profile bot-signin build bot-signin`.
  bot-signin:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot-signin
    image: johnny-bot-signin:latest
    profiles: ["bot-signin"]
    # Per-session containers attach the shared handoff volume so the
    # supervisor's storage_state + marker land where the API can pick
    # them up.
    volumes:
      - bot_signin_pending:/mnt/pending

volumes:
  postgres_data:
  redis_data:
  worker_state:
  google_auth_state:
  bot_signin_pending:
