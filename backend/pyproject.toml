[project]
name = "johnny-backend"
version = "0.1.0"
description = "Johnny — Google Meet AI meeting bot backend"
authors = [
    { name = "Nikita R", email = "nikita.rabykin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "redis>=5.0.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "docker>=7.1.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# `johnny-setup` becomes the entrypoint for the interactive setup wizard
# (Johnny-61y). Invokable directly after `uv sync` without `-m`.
johnny-setup = "johnny.wizard.cli:main"
# `johnny-smoke` runs the post-setup smoke test (Johnny-f7k). Verifies a
# populated .env produces a working stack and provider responses.
johnny-smoke = "johnny.smoketest.cli:main"
# `johnny-tts-smoke` drives every saved TTS provider × runtime × voice through
# play_sample and asserts audible PCM (Johnny-1ge.7), catching silent-failure
# runtimes that return a 200 with empty/all-zero audio.
johnny-tts-smoke = "johnny.smoketest.tts_cli:main"
# `johnny-replay` replays committed session fixtures through the real voice
# pipeline and asserts the .28.x invariants (no silent drops, decision↔utterance
# parity) — the offline regression harness for the pipeline (Johnny-ckz.28.5).
johnny-replay = "johnny.smoketest.replay_cli:main"

[project.optional-dependencies]
# Heavy ML dep for on-device STT. Only the meet-worker image needs it
# at runtime; the API container imports the adapter lazily and never
# touches the library unless a session actually uses faster-whisper.
local-stt = [
    "faster-whisper>=1.0.0",
]
# On-device TTS. `piper-tts` ships the `piper` CLI used by the adapter
# (subprocess that reads text on stdin, writes raw PCM on stdout). The
# api/worker images install this so the providers `/test` smoke call
# can synthesize; the meet-worker image installs it independently to
# keep that image self-contained.
local-tts = [
    "piper-tts>=1.4.0",
]
# Neural on-device TTS for the `in-container` runtime of the Kokoro and
# KittenTTS providers (Johnny-1ge.11). Kokoro is an 82 M torch model;
# KittenTTS is a <25 M ONNX model shipped as a GitHub-release wheel;
# `misaki[en]` is Kokoro's English grapheme-to-phoneme stack. These are
# BAKED into the api/worker image (the Dockerfile installs this extra) so
# the in-container runtime works on a clean `./run.sh` with zero manual
# install steps — see the clean-install contract in AGENTS.md. torch is
# pinned to the CPU wheel index in [tool.uv] below so the image does not
# drag in ~5 GB of CUDA libraries it can never use on a CPU/Apple-Silicon
# host.
neural-tts = [
    # torch is declared DIRECTLY (not just left as kokoro's transitive dep)
    # so the [tool.uv.sources] CPU-index pin below actually binds to it —
    # uv sources only apply to direct project dependencies. Without this the
    # resolver takes torch's default PyPI wheel, which drags ~5 GB of
    # nvidia-*/cuda-* packages onto arm64 Linux too (Johnny-1ge.11).
    "torch>=2.2",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    # Kokoro's English G2P (misaki[en]) loads spaCy's `en_core_web_sm`
    # pipeline and, when it is absent, runs `pip install en_core_web_sm` at
    # the FIRST synth — a runtime download into the ephemeral container venv
    # that vanishes on every container recreate and needs network on every
    # clean boot. Pin the model wheel so it is baked into the image and the
    # first synth is offline-clean (Johnny-1ge.11). 3.8.0 matches spaCy 3.8.x.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl",
]
# Host-side helpers (auth-state seeder for Johnny-ckz.1). Installs
# Playwright on the host so the operator can open Chromium headed,
# sign into Google as the bot account, and persist the resulting
# storage_state.json into the shared docker volume.
auth-seed = [
    "playwright>=1.49.0",
]
# LiveKit Agents orchestration engine (epic Johnny-7g5). `livekit-agents`
# is the AgentSession runtime that is replacing the hand-rolled
# johnny/voice_pipeline/pipeline.py; the `[silero,turn-detector]` extras
# pull livekit-plugins-silero (Silero VAD) and livekit-plugins-turn-detector
# (the MultilingualModel end-of-utterance detector). Pinned to the exact
# release the operator validated from the cloned agent-starter-python.
# The api/worker image BAKES this in (backend/Dockerfile installs
# `--extra agent`) AND runs `python -m livekit.agents download-files` at
# build time so the Silero VAD + multilingual turn-detector ONNX models
# are present offline on a clean `./run.sh` — see the clean-install
# contract in AGENTS.md. Johnny is SELF-HOSTED: it brings its own
# STT/LLM/TTS provider adapters (johnny/agent/) and deliberately does NOT
# use LiveKit Cloud Inference or the ai-coustics cloud noise-cancellation
# plugin from the starter template.
agent = [
    "livekit-agents[silero,turn-detector]==1.5.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "johnny"]

[tool.hatch.metadata]
# The kittentts dependency (neural-tts extra) is a direct GitHub-release
# wheel URL — it is not on PyPI. hatchling rejects direct references when
# building/installing this project unless this is opted in.
allow-direct-references = true

[tool.uv]
# torch's default wheels bundle the full CUDA runtime (~5 GB of nvidia-*
# packages) even for arm64 Linux, but Johnny runs CPU-only (Apple Silicon
# hosts, generic CPU boxes). Pin torch — pulled in transitively by kokoro
# (the neural-tts extra) — to PyTorch's CPU wheel index so the api/worker
# image stays lean (torch==X.Y.Z+cpu, no nvidia-* packages). `explicit`
# keeps this index from shadowing PyPI for any package that does not opt in
# via [tool.uv.sources] below.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "livekit_smoke: opt-in smoke tests that exercise LiveKitTransport against a running dev server (US-025)",
    "e2e_ui: opt-in end-to-end provider UI tests against a live Compose stack (Johnny-upg)",
    "network: opt-in tests that hit live external services — run locally before claiming a fix, CI may skip when offline (Johnny-ckz.5)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "johnny", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

# livekit-agents ships only in the api/agent image (the `agent` extra,
# epic Johnny-7g5); the dev/CI mypy run does not install it, so resolving
# the SDK imports in johnny/agent/* would otherwise fail. The package is
# import-guarded (only johnny.agent.session pulls livekit in) and exercised
# in the baked image, so silence missing-stub errors here.
[[tool.mypy.overrides]]
module = "livekit.*"
ignore_missing_imports = true
