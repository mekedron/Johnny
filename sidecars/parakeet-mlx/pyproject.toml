[project]
name = "parakeet-mlx-sidecar"
version = "0.1.0"
description = "Apple MLX Parakeet sidecar — runs natively on macOS for fast Metal-accelerated STT, posts results back to the Johnny api container over HTTP."
requires-python = ">=3.10"
dependencies = [
    "parakeet-mlx>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
]

[project.scripts]
parakeet-mlx-sidecar = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
