[project]
name = "kokoro-http-sidecar"
version = "0.1.0"
description = "Generic Kokoro TTS sidecar — runs the upstream Kokoro model in its own process (e.g. an x86_64 Linux GPU host); the Johnny api container POSTs text and gets raw PCM back over HTTP."
requires-python = ">=3.10"
dependencies = [
    "kokoro>=0.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
]

[project.scripts]
kokoro-http-sidecar = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
