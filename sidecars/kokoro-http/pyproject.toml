[project]
name = "kokoro-http-sidecar"
version = "0.1.0"
description = "Generic Kokoro TTS sidecar — runs the upstream Kokoro model in its own process (e.g. an x86_64 Linux GPU host); the Johnny api container POSTs text and gets raw PCM back over HTTP."
requires-python = ">=3.10"
dependencies = [
    "kokoro>=0.9.0",
    # Kokoro treats misaki as an OPTIONAL dependency, so `pip install kokoro`
    # does NOT pull it in — the first synth then raises "Kokoro requires the
    # optional 'misaki' package for text processing" (Johnny-1ge.11). Pin it
    # here explicitly, with the [en] extra (spacy + English G2P), so a clean
    # `./scripts/start-kokoro-sidecar.sh start` produces a working sidecar.
    "misaki[en]>=0.9.4",
    # misaki[en]'s English G2P loads spaCy's `en_core_web_sm` and pip-installs
    # it at the FIRST synth when absent. Pin the model wheel so a clean
    # `./scripts/start-kokoro-sidecar.sh start` produces a venv that can synth
    # offline immediately, with no first-call download (Johnny-1ge.11).
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
]

[project.scripts]
kokoro-http-sidecar = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# en_core_web_sm is a direct GitHub-release wheel URL (not on PyPI);
# hatchling rejects direct references unless this is opted in.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
