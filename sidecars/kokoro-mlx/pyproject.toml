[project]
name = "kokoro-mlx-sidecar"
version = "0.1.0"
description = "Apple MLX Kokoro TTS sidecar — runs Kokoro natively on macOS for Metal-accelerated synthesis; the Johnny api container POSTs text and gets raw PCM back over HTTP."
requires-python = ">=3.10"
dependencies = [
    "mlx-audio>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
]

[project.scripts]
kokoro-mlx-sidecar = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
